{
  "schema": "operating-workspace/v1",
  "id": "opencodelab",
  "name": "OpenCodeLab",
  "class": "product",
  "status": "active",
  "purpose": "Provide a secure, portable CLI that runs compatible Hugging Face models inside OpenCode on scale-to-zero Modal GPUs.",
  "canonical": {
    "host": "Liams-MacBook-Pro",
    "path": "/Users/liamvdb/Workspace/Active/Personal/opencodelab",
    "access": "local",
    "writer_policy": "This repository owns OpenCodeLab code, tests, packaging, documentation, and release truth."
  },
  "authority": {
    "owns": [
      "OpenCodeLab source code",
      "tests and packaging",
      "public documentation and release evidence"
    ],
    "defers_to": [
      {"topic": "coding work-order lifecycle", "authority": "Code Operations"},
      {"topic": "external posting and partner applications", "authority": "Liam"}
    ],
    "never_owns": [
      "Modal or OpenCode policy",
      "user credentials",
      "unapproved GPU spend",
      "social publishing authority"
    ]
  },
  "bootstrap": {
    "agent": ["AGENTS.md"],
    "human": ["README.md"]
  },
  "state": {
    "entrypoints": [
      {"kind": "command", "value": "git status --short --branch", "description": "Inspect current repository state."},
      {"kind": "command", "value": "PYTHONPATH=src uv run --no-project --with pytest --with modal --with keyring --with platformdirs python -m pytest -q", "description": "Run the local non-inference test suite."}
    ]
  },
  "operations": [
    {"id": "test", "kind": "command", "entrypoint": "PYTHONPATH=src uv run --no-project --with pytest --with modal --with keyring --with platformdirs python -m pytest -q", "effect": "read-only", "description": "Run tests without Modal deployment or inference."},
    {"id": "build", "kind": "command", "entrypoint": "uv run --no-project --with build python -m build", "effect": "workspace-write", "description": "Build wheel and sdist locally."}
  ],
  "approvals": {
    "internal_reversible_coding_and_tooling": "Operating Partner or Code Operations may authorize internally.",
    "external_or_production_effect": "Liam approval required.",
    "credentials_destructive_action_or_major_budget": "Liam approval required."
  },
  "learning": {
    "location": "AGENTS.md",
    "promotion_policy": "Keep reusable repository execution rules local and concise."
  },
  "replication": {
    "strategy": "GitHub is the public code and release mirror; the main Mac is the canonical working copy for this synchronization period.",
    "canonical_writer": "opencodelab on Liams-MacBook-Pro",
    "excludes": ["credentials", "generated secrets", "build caches", "provider-native session history"]
  },
  "interfaces": {
    "provides": ["OpenCodeLab CLI", "Modal deployment template", "OpenCode provider overlay"],
    "consumes": ["Modal CLI and service", "OpenCode CLI", "Hugging Face model identifiers"]
  }
}
