[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "opencodelab"
version = "0.1.0"
description = "Run compatible Hugging Face models inside OpenCode on scale-to-zero Modal GPUs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Liam Van den Broeck" }]
dependencies = [
  "keyring>=25,<27",
  "modal>=1.5,<2",
  "platformdirs>=4,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
]

[project.scripts]
opencodelab = "opencodelab.cli:main"

[project.urls]
Homepage = "https://github.com/LiamVDB1/opencodelab"
Repository = "https://github.com/LiamVDB1/opencodelab"
Issues = "https://github.com/LiamVDB1/opencodelab/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
